name: Build KUHULU MOMO Android APKs

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build customer and owner APKs
        run: gradle assembleCustomerDebug assembleOwnerDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: KUHULU-MOMO-APKs
          path: |
            app/build/outputs/apk/customer/debug/*.apk
            app/build/outputs/apk/owner/debug/*.apk
